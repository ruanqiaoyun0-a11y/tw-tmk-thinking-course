<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>臺灣 TMK 入門｜VIPTHINK</title><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip" href="#main">跳到學習內容</a>
<header class="topbar"><a class="brand" href="#home" aria-label="VIPTHINK 課程首頁">VIPTHINK<span>臺灣 TMK 入門</span></a><button id="menu" class="outline small" aria-expanded="false" aria-controls="sidebar">章節導覽</button><span class="top-note">思考與學習理念</span></header>
<div class="layout"><aside id="sidebar"><div class="nav-label">我的學習</div><nav aria-label="課程章節" id="nav"></nav><div class="progress-card"><div class="progress-label"><span>學習進度</span><strong id="progressText">0%</strong></div><div class="progress-track" role="progressbar" aria-label="學習進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressFill"></div></div><p id="progressHint">從第一章開始，認識數學思考。</p></div><button class="outline certificate-nav" id="certNav">結業證書</button></aside><main id="main" tabindex="-1"></main></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="certificateDialog" aria-labelledby="certDialogTitle"><div class="dialog-toolbar"><h2 id="certDialogTitle">領取結業證書</h2><button id="closeCert" class="outline small">關閉</button></div><div id="certEntry"><p>請填寫希望顯示在證書上的姓名。</p><label for="studentName">學員姓名</label><input id="studentName" type="text" maxlength="80" autocomplete="name" placeholder="請輸入姓名"><p id="nameError" role="alert" class="error"></p><button id="previewCert" class="primary">預覽證書</button></div><div id="certPreview" hidden><div id="certificate" class="certificate"><div class="cert-brand">VIPTHINK</div><h2>結業證書</h2><div class="cert-sub">CERTIFICATE OF COMPLETION</div><div id="certName" class="cert-name"></div><div class="cert-body">已完成<br><strong>《臺灣 TMK 入門：用白話認識數學思考》</strong><br>微課及隨堂練習，特頒此證。</div><div id="certDate" class="cert-date"></div></div><div class="cert-actions"><button id="editName" class="outline">修改姓名</button><button id="printCert" class="primary">列印／另存為 PDF</button></div><p class="print-help">在列印視窗選擇「另存為 PDF」，並關閉頁首及頁尾。</p></div></dialog>
<script src="course-data.js"></script><script src="state.js"></script><script src="media.js"></script><script src="app.js"></script>
</body></html>
